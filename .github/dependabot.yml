version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm minimumReleaseAge (7 days).
    cooldown:
      default-days: 7
    ignore:
      # Published without provenance; pnpm trustPolicy rejects it (docs/progresso.md).
      - dependency-name: lefthook
        versions: ["2.2.2"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
