name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --verbose .

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject bidi control characters (Trojan Source)
        # U+202A-U+202E and U+2066-U+2069 as UTF-8 bytes, in every tracked file. Binary files are
        # searched too: a NUL byte must not hide a source file. Exclude a real binary by pathspec.
        run: |
          status=0
          LC_ALL=C git grep -nP '\xE2\x80[\xAA-\xAE]|\xE2\x81[\xA6-\xA9]' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Bidi control character in a tracked file (Trojan Source). Write it as a \\u escape."
            exit 1
          fi
          [ "$status" -eq 1 ] # 1 = no match; anything else is a git grep error
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true # pnpm store, keyed by pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false # pnpm/action-setup already caches
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  browser:
    # Webmail flows in Firefox against the fake Worker (apps/webmail/e2e/browser). Fake
    # credentials only: this job uses no secret. Firefox and its system libraries are installed
    # on the GitHub runner, never on the server (docs/decisoes.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install Firefox for Playwright
        run: pnpm --filter @webmail/webmail exec playwright install --with-deps firefox
      - run: pnpm --filter @webmail/webmail test:browser
